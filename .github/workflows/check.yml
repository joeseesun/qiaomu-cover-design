name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: qiaomu-cover-design
          path: |
            main.js
            manifest.json
            styles.css
            LICENSE
            THIRD_PARTY.md
