name: 功能建议 / Feature request
description: 描述你要解决的问题和期望结果。
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Problem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果 / Expected outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法 / Current workaround
