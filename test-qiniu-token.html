<!DOCTYPE html>
<html>
<head>
  <title>七牛云 Token 测试</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <h1>七牛云 Token 生成测试</h1>
  <button onclick="testToken()">生成 Token</button>
  <pre id="output"></pre>

  <script>
    function testToken() {
      const accessKey = 'p5en81L6k53PkgCQywYK9vX9BJLnJqrtmvBXkFaW';
      const secretKey = 'qV4m6r47s9okI7PEjCyrG6xMKtr9hmJMz1z4ZHEk';
      const bucket = 'joemarkdown';
      const key = 'test-image.png';

      // 1. 构造上传策略
      const putPolicy = {
        scope: `${bucket}:${key}`,
        deadline: Math.floor(Date.now() / 1000) + 3600,
      };

      // 2. JSON 序列化
      const policyStr = JSON.stringify(putPolicy);
      console.log('1. policyStr:', policyStr);

      // 3. Base64 编码（URL 安全）
      const policyWordArray = CryptoJS.enc.Utf8.parse(policyStr);
      const policyBase64 = CryptoJS.enc.Base64.stringify(policyWordArray);
      const encodedPutPolicy = policyBase64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      console.log('2. encodedPutPolicy:', encodedPutPolicy);

      // 4. HMAC-SHA1 签名
      const sign = CryptoJS.HmacSHA1(encodedPutPolicy, secretKey);
      console.log('3. sign (WordArray):', sign.toString());

      // 5. 签名 Base64 编码（URL 安全）
      const signBase64 = CryptoJS.enc.Base64.stringify(sign);
      console.log('4. signBase64:', signBase64);
      const encodedSign = signBase64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      console.log('5. encodedSign:', encodedSign);

      // 6. 拼接 Token
      const uploadToken = `${accessKey}:${encodedSign}:${encodedPutPolicy}`;
      console.log('6. uploadToken:', uploadToken);

      // 显示结果
      document.getElementById('output').textContent = JSON.stringify({
        putPolicy,
        policyStr,
        encodedPutPolicy,
        signHex: sign.toString(),
        signBase64,
        encodedSign,
        uploadToken: uploadToken.substring(0, 100) + '...',
      }, null, 2);

      // 测试上传
      testUpload(uploadToken, key);
    }

    async function testUpload(token, key) {
      const file = new Blob(['test content'], { type: 'text/plain' });
      const formData = new FormData();
      formData.append('token', token);
      formData.append('key', key);
      formData.append('file', file, 'test.txt');

      try {
        const response = await fetch('https://up.qiniup.com', {
          method: 'POST',
          body: formData,
        });

        console.log('Upload response status:', response.status);
        const result = await response.text();
        console.log('Upload response body:', result);

        if (response.ok) {
          alert('上传成功！\n' + result);
        } else {
          alert('上传失败！\n' + result);
        }
      } catch (error) {
        console.error('Upload error:', error);
        alert('上传错误：' + error.message);
      }
    }
  </script>
</body>
</html>
